version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: twitter_clone_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: twitter_clone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: twitter_clone_backend
    environment:
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/twitter_clone
      JWT_SECRET: docker-jwt-secret-change-in-production
      PORT: 3001
      FRONTEND_URL: http://localhost
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy &&
             node prisma/seed.js &&
             node src/app.js"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: twitter_clone_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: